<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Blackvoid — an independent technology studio building web applications, software products and digital experiences.">
  <title>Blackvoid — Start a Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

</head>

<body>
  <div id="site-header"></div>
  <main>
    <section class="contact-hero">
      <div class="container">
        <div class="contact-layout">
          <div>
            <div class="eyebrow reveal">START A PROJECT</div>
            <h1 class="display-title reveal">Have an idea?<br><span>Let's build it.</span></h1>
            <p class="lead-copy reveal">Tell us what you're thinking. We'll take it from there.</p>
          </div>
          <form class="contact-form reveal" id="enquiry-form">
            <label>Name<input required type="text" name="name" placeholder="Your name"></label>
            <label>
              Contact
              <input
                required
                type="tel"
                name="number"
                placeholder="10-digit mobile number"
                maxlength="10"
                pattern="[6-9][0-9]{9}"
                inputmode="numeric"
                autocomplete="tel"
              >
            </label>
            <label>Email<input required type="email" name="email" placeholder="you@example.com"></label>
            <label>Project type<select name="type">
                <option>Web Application</option>
                <option>Software Product</option>
                <option>UI / UX</option>
                <option>Custom IT Solution</option>
                <option>Other</option>
              </select></label>
            <label>Tell us about it<textarea required name="message" rows="6"
                placeholder="A few words about your idea..."></textarea></label>
            <button class="btn btn-lime" type="submit">Send Enquiry ↗</button>
            <p id="form-note" class="form-note"></p>
          </form>
        </div>
      </div>
    </section>
    <section class="section section-soft">
      <div class="container contact-info">
        <div><span class="eyebrow">EMAIL</span>
          <a href="mailto:hello@blackvoid.in">info.blackvoid@gmail.com</a>
        </div>
        <div><span class="eyebrow">BASED IN</span>
          <p>Kerala, India</p>
        </div>
        <!-- <div><span class="eyebrow">SOCIAL</span>
          <p>LinkedIn · Instagram · GitHub</p>
        </div> -->
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
